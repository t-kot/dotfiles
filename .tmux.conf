set -g default-terminal "tmux-256color"
# Enable truecolor if terminal supports it
set -as terminal-features 'xterm-256color:RGB'
set -as terminal-features 'tmux-256color:RGB'

# Attach panes to the user's GUI login session via reattach-to-user-namespace.
# Needed so programs inside tmux (e.g. Claude Code) can reach the macOS Keychain /
# securityd — without it, keychain access fails with "Module Directory Service error".
set-option -g default-command "reattach-to-user-namespace -l zsh"
set-window-option -g mode-keys vi
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5

#keybind
set-option -g prefix C-s
unbind -T prefix C-b
bind-key -T prefix s send-prefix
bind-key -T prefix z suspend-client
bind-key -T prefix C-k kill-pane
bind-key -T prefix C-j split-window -v -c "#{pane_current_path}"
bind-key -T prefix C-l split-window -h -c "#{pane_current_path}"
# Custom: prefix + c for new window (always start in $HOME, not the tmux
# server's cwd — which can end up as "/" when the server is started by
# launchd / a restored terminal session)
unbind -T prefix c
bind-key -T prefix c new-window -c "$HOME"
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

bind-key -T prefix r source-file ~/.tmux.conf \; display "Reloaded!"

# Enable modern mouse support
set -g mouse on

# Drop legacy alternate screen override
# set -g terminal-overrides 'xterm*:smcup@:rmcup@'
# Modern macOS clipboard integration in copy-mode-vi
set -g set-clipboard on
set -g allow-passthrough on
unbind -T copy-mode-vi y
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Bell: highlight pane/window in status bar on bell (for Claude Code notifications)
set -g monitor-bell on

# Status bar tabs (windows): name by current directory, not by running program
# (prefix + , to set a fixed name)
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# --- Per-tab Claude Code / process state indicator ---
# The window option @cc_state is set by Claude Code hooks (see .claude-global/settings.json):
#   ⏳ = running / processing   ✅ = finished (needs your eyes)   🔔 = waiting for input
# The marker is cleared automatically when you switch into that window.
set-hook -g after-select-window 'set-option -w @cc_state ""'

# Non-current tabs: color by state (green=done, orange=needs input) + show the emoji.
setw -g window-status-separator ""
setw -g window-status-format "#{?#{==:#{@cc_state},✅},#[fg=colour232#,bg=colour35#,bold],#{?#{==:#{@cc_state},🔔},#[fg=colour232#,bg=colour214#,bold],#[default]}} #I:#W #{@cc_state} #[default]"
# Current tab: highlighted, no marker needed (you're looking at it).
setw -g window-status-current-format "#[fg=colour232#,bg=colour39#,bold] #I:#W #[default]"

# Navigate when there are too many tabs to see at once:
#   prefix + w  -> choose-tree overview of all windows (with live preview)
#   prefix + f  -> find window by name
bind-key -T prefix w choose-tree -Zw
bind-key -T prefix Space choose-tree -Zw

# Mouse drag: keep selection without copying (explicit 'y' to copy)
unbind -T copy-mode-vi MouseDragEnd1Pane

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'

